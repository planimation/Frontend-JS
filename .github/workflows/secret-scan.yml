name: Secret scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Scan for hardcoded credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Catches GitHub tokens even when split across concatenated strings,
      # which regex-based scanners (and GitHub push protection) miss.
      - name: Block GitHub token prefixes in source
        run: |
          if grep -rnE '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]|github_pat[_]' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::GitHub token found in source. Front-end code is public; never embed credentials."
            exit 1
          fi

      - name: Run gitleaks on the working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --no-git --source=/repo --redact --verbose
